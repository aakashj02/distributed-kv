syntax = "proto3";

package kv;

option go_package = "github.com/aakashj02/distributed-kv/proto;kv";

// KeyValueStore defines the networking capabilities of our cluster nodes
service KeyValueStore {
  rpc Put (PutRequest) returns (PutResponse);
  rpc Get (GetRequest) returns (GetResponse);
}

message PutRequest {
  string key = 1;
  string value = 2;
}

message PutResponse {
  bool success = 1;
}

message GetRequest {
  string key = 1;
}

message GetResponse {
  string value = 1;
  bool found = 2;
}